<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Super Dario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --clay:#D97757; --cream:#F5F0E8; --ink:#2b211c; }
  html,body { margin:0; height:100%; background:#1f1814; overflow:hidden; touch-action:none; }
  body { display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P', monospace; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display:block; max-width:100vw; max-height:100vh; aspect-ratio: 960/544; width: min(100vw, calc(100vh * 960 / 544)); }
  #touch { position:fixed; inset:auto 0 0 0; display:none; justify-content:space-between; padding:16px 18px calc(16px + env(safe-area-inset-bottom)); pointer-events:none; }
  #touch .grp { display:flex; gap:14px; pointer-events:auto; }
  #touch button { width:72px; height:72px; border-radius:50%; border:3px solid var(--cream); background:rgba(217,119,87,.55); color:var(--cream); font:16px 'Press Start 2P', monospace; user-select:none; -webkit-user-select:none; }
  @media (pointer:coarse) { #touch { display:flex; } }
  #rec { position:fixed; top:12px; right:12px; z-index:5; padding:10px 14px; border-radius:10px; border:2px solid var(--cream); background:#2b211c; color:var(--cream); font:12px 'Press Start 2P', monospace; cursor:pointer; }
  #rec.on { background:#c0392b; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { border-color:#2b211c; } }
  #recpanel { position:fixed; inset:0; z-index:6; display:flex; align-items:center; justify-content:center; background:rgba(31,24,20,.82); }
  #recpanel[hidden] { display:none; }
  #recpanel .box { background:var(--cream); color:var(--ink); border:3px solid var(--clay); border-radius:12px; padding:18px; width:min(92vw,560px); text-align:center; font:12px/1.8 'Press Start 2P', monospace; }
  #recpanel video { width:100%; border-radius:6px; background:#000; margin:10px 0; }
  #recpanel a, #recpanel button { display:inline-block; margin:6px; padding:12px 16px; border-radius:8px; border:0; font:12px 'Press Start 2P', monospace; cursor:pointer; text-decoration:none; }
  #recpanel a { background:var(--clay); color:#fff; } #recpanel button { background:#d8cfc2; color:var(--ink); }
  #recpanel .nm { font-size:9px; color:#7a6a5c; word-break:break-all; }
</style>
</head>
<body>
<canvas id="c" width="960" height="544"></canvas>
<button id="rec" title="Record gameplay with sound (R)">● Record</button>
<div id="recpanel" hidden><div class="box">
  <div>Recording saved</div>
  <video controls playsinline></video>
  <div class="nm"></div>
  <a href="#" download>Save video</a><button class="close">Keep playing</button>
</div></div>
<div id="touch">
  <div class="grp"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div class="grp"><button data-k="fire">✱</button><button data-k="jump">▲</button></div>
</div>
<script src="game.js?v=3"></script>
</body>
</html>
